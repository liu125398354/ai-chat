# 生产反代示例：SSE 须关闭缓冲，超时 ≥ QIANFAN_TIMEOUT_MS + 5s（默认 125s）
# location 与 Vite 开发代理对齐：浏览器打 /api/v1/... ，上游为 Nest /v1/...

upstream ai_chat_api {
    server 127.0.0.1:3000;
}

server {
    listen 443 ssl;
    server_name chat.example.com;

    location ~ ^/api/v1/conversations/.+/messages:stream$ {
        proxy_pass http://ai_chat_api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-transform";
        gzip off;
    }

    location /api/ {
        proxy_pass http://ai_chat_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
